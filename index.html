<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A clean trading journal to log trades, track P&L, and review your performance."
    />
    <meta name="theme-color" content="#f3f5fb" />
    <title>Trading Journal</title>
    <script>
      // Apply the saved (or system) theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('trading-journal.theme.v1'))
        var theme =
          saved === 'dark' || saved === 'light'
            ? saved
            : matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
        document.documentElement.dataset.theme = theme
        document.querySelector('meta[name="theme-color"]').setAttribute('content', theme === 'dark' ? '#0b0f19' : '#f3f5fb')
      } catch (e) {
        /* ignore */
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
